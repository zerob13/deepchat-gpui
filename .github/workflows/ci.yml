name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Workspace / macOS
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

  portable-storage:
    name: Storage services / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DEEPCHAT_REFERENCE_REPOSITORY: ${{ runner.temp }}/deepchat-reference
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint portable storage crates
        run: cargo clippy -p deepchat-services -p deepchat-platform --all-targets --all-features -- -D warnings

      - name: Test portable storage crates
        run: cargo test -p deepchat-services -p deepchat-platform

      - name: Check out frozen reference
        shell: bash
        run: |
          git init "$DEEPCHAT_REFERENCE_REPOSITORY"
          git -C "$DEEPCHAT_REFERENCE_REPOSITORY" fetch --depth=1 \
            https://github.com/ThinkInAIXYZ/deepchat.git \
            ca75acfdc680fa3d0a2bbde13575fa711d08a3bd
          test "$(git -C "$DEEPCHAT_REFERENCE_REPOSITORY" rev-parse FETCH_HEAD)" = \
            ca75acfdc680fa3d0a2bbde13575fa711d08a3bd

      - name: Audit parity contract
        run: python3 tools/parity-audit/validate.py
