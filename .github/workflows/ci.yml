name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Workspace / macOS
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

      - name: Audit parity contract
        run: uv run python tools/parity-audit/validate.py

  portable-storage:
    name: Storage services / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint portable storage crates
        run: cargo clippy -p deepchat-services -p deepchat-platform --all-targets --all-features -- -D warnings

      - name: Test portable storage crates
        run: cargo test -p deepchat-services -p deepchat-platform

      - name: Audit parity contract
        run: uv run python tools/parity-audit/validate.py
