[workspace]
members = ["crates/deepchat-app", "crates/deepchat-services", "crates/deepchat-platform"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "macos-blade"] }
unicode-segmentation = "1.12.0"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
secrecy = "0.10.3"
thiserror = "1.0.69"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27.0"
security-framework = "3.7.0"
